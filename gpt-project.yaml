project:
  id: statistikassistenten
  name: Statistikassistenten
  description: Assistent för verifierbara frågor mot officiell svensk, europeisk
    och global statistik.
  language: sv
  profile: workflow_research_heavy
  lifecycle: development
analysis:
  model_robustness: guided
  runtime:
    strategy: peer_candidates
    candidates:
    - runtime_id: chatgpt_chat
      suitability: equivalent
      activate_by_default: true
      reason: Webbsökning, dataanalys och filhantering stödjer kärnflödet.
    - runtime_id: chatgpt_custom
      suitability: equivalent
      activate_by_default: true
      reason: Byggd och validerad Custom GPT-distribution med nyckelfria Actions och verifierade officiella fallback-vägar för stödda källor.
    - runtime_id: claude_projects
      suitability: reduced
      activate_by_default: false
      reason: Instruktioner kan porteras men extern verktygsparitet kan inte förutsättas.
    - runtime_id: opencode
      suitability: equivalent
      activate_by_default: true
      reason: Byggd OpenCode-workspace med AGENTS.md, canonical Knowledge och genererade
        custom tools för de deterministiska statistikskripten.
    - runtime_id: openai_plugin
      suitability: equivalent_runtime_dependent
      activate_by_default: true
      reason: Skills-first runtime kan bevara canonical statistikflöde när hosten erbjuder web/HTTP och structured data; lokala scripts är rekommenderade guardrails med degrade-fallback.
instructions:
  canonical: assistant/instructions.md
  core_contract:
    enabled: true
    required_markers:
    - METADATA-GATE
    - DATA-GATE
    - METHOD-GATE
    - PROVENANCE-GATE
    required_runtime_dependencies: []
    max_required_file_hops: 1
    knowledge_may_not_be_required_for_core_behavior: true
capabilities:
  contract_version: 1
  schema: schemas/capability-contract.schema.json
  recommendation_mode: inferred_from_use_case
  ask_user_only_when_business_choice_is_ambiguous: true
  requirements:
    web:
      level: required
      reason: Aktuell metadata och officiell statistik måste kunna verifieras vid
        frågetillfället.
    filesystem:
      read: recommended
      write: recommended
    shell:
      level: optional
    code_execution:
      level: recommended
      reason: Behövs för säkra beräkningar, normalisering och export.
    structured_data:
      level: required
    persistent_state:
      level: optional
      reason: Enskilda statistikfrågor kräver normalt inte långtidsstate.
    external_tools:
      level: recommended
      preferred_protocols:
      - api
    image_generation:
      level: not_required
artifacts:
  contract_version: 1
  schema: schemas/artifact-contract.schema.json
  outputs:
    development_plan:
      kind: document
      format: markdown
      requirement: required
      persistence: persistent
      multiplicity: one
      description: Stegvis utvecklingsplan.
    project_package:
      kind: package
      format: zip
      requirement: required
      persistence: persistent
      multiplicity: one
      filename_pattern: statistikassistenten-project-<version>.zip
      description: Komplett canonical utvecklingsprojekt.
    runtime_package:
      kind: distribution
      format: zip
      requirement: conditional
      condition: runtime_build_step
      persistence: persistent
      multiplicity: many
      description: Runtime-specifika distributioner.
    statistical_export:
      kind: data
      format: markdown-or-csv
      requirement: optional
      persistence: ephemeral
      multiplicity: many
      description: Data- eller analysuttag som användaren uttryckligen ber om.
workspace_state:
  contract_version: 1
  schema: schemas/workspace-state-contract.schema.json
  workspace:
    requirement: required
    persistence: required
    portable: true
    separate_from_assistant: true
    artifact: project_package
    description: Projekt-ZIP:en är den portabla sanningskällan för fortsatt utveckling.
  state:
    requirement: required
    persistence: required
    authority: workspace_file
    format: yaml
    path: project-status.yaml
    conversation_fallback: false
    description: Strukturerad projektstatus styr återupptagning och nästa steg.
  runtime_preferences:
    chat: conversation_or_file
    agent: workspace_file
runtime:
  chat_zip:
    enabled: true
    start_here_template: templates/START-HERE.chat.md.tpl
  custom_gpt:
    enabled: true
    instruction:
      mode: compiled
      max_characters: 8000
    knowledge:
      strategy: prioritize
      max_files: 20
    templates:
      capabilities: templates/CAPABILITIES.custom-gpt.md.tpl
      readme: templates/README.custom-gpt.md.tpl
      compatibility: templates/COMPATIBILITY.custom-gpt.md.tpl
    builder:
      runtime_contract: builder/runtime-contract.json
    actions:
      directory: runtime-assets/custom-gpt/actions
      authentication: none
  claude:
    enabled: false
  opencode:
    enabled: true
    role: peer_distribution
    mode: opencode_workspace
    layout:
      instructions: AGENTS.md
      runtime_contract: .opencode/runtime-contract.json
      knowledge: knowledge
      config: opencode.json
      tools: .opencode/tools
      runtime_scripts: .opencode/runtime-scripts
    validation:
      require_agents_md: true
      require_runtime_contract: true
    skills:
      enabled: false
      directory: .opencode/skills
      definitions: []
    templates:
      readme: templates/README.opencode.md.tpl
  plugin:
    enabled: true
    role: peer_distribution
    mode: skills_first
    layout:
      manifest_file: plugin.json
      skills: skills
    templates:
      readme: templates/README.plugin.md.tpl
    validation:
      require_skill: true
      require_skill_frontmatter: true
build:
  build_chat_zip: true
  build_custom_gpt_zip: true
  build_claude_zip: false
  build_opencode_zip: true
  build_plugin_zip: true
build_system:
  targets:
  - project
  - chat
  - custom-gpt
  - opencode
  - plugin
  runtime_targets:
    chat:
      runtime_id: chatgpt_chat
      runtime_key: chat_zip
      builder: chat
      artifact_type: chat_zip
      filename_pattern: <project-id>-chat-<version>.zip
    custom-gpt:
      runtime_id: chatgpt_custom
      runtime_key: custom_gpt
      builder: custom_gpt
      artifact_type: custom_gpt_zip
      filename_pattern: <project-id>-custom-gpt-<version>.zip
    opencode:
      runtime_id: opencode
      runtime_key: opencode
      builder: opencode
      artifact_type: opencode_zip
      filename_pattern: <project-id>-opencode-<version>.zip
    plugin:
      runtime_id: openai_plugin
      runtime_key: plugin
      builder: plugin
      artifact_type: plugin_zip
      filename_pattern: <project-id>-plugin-<version>.zip
runtime_parity:
  registered_runtimes:
  - chatgpt_chat
  - chatgpt_custom
  - claude_projects
  - opencode
  - openai_plugin
skills:
  contract_version: 1
  schema: schemas/skill-contract.schema.json
  mode: explicit
  definitions:
  - id: statistikassistenten
    name: statistikassistenten
    description: Verifiera officiell statistik genom metadata-gate, datauttag, metodkontroll, deterministiska beräkningar och provenance; använd hostens web/API-stöd och paketerade script-resurser när de är tillgängliga.

knowledge_architecture:
  canonical_root: knowledge
  principle: domain_reference_only
  custom_gpt:
    priority:
    - knowledge/source-and-method-reference.md
    - knowledge/custom-gpt-actions.md
workflow:
  robustness: guided
  mode: explicit_state_machine
  policy: assistant/policies/development-workflow.md
  states:
    idea_analysis:
      next:
      - architecture
    architecture:
      next:
      - planning
    planning:
      next:
      - implementation
    implementation:
      next:
      - validation
    validation:
      next:
      - implementation
      - packaging
    packaging:
      next:
      - release
    release:
      next:
      - maintenance
    maintenance:
      next:
      - implementation
      - validation
    blocked:
      next:
      - implementation
      - validation
    paused:
      next:
      - implementation
  operational_core:
  - read_project_contract
  - read_project_status
  - select_one_state_or_bounded_goal
  - load_only_relevant_policy
  - execute_change
  - validate_deterministically
  - correct_before_completion_on_failure
  - update_structured_status_after_pass
  - rebuild_project_zip_when_required
  - recommend_next_step_from_actual_state
  core_flow:
  - tolka_fraga
  - valj_kalla
  - verifiera_metadata
  - hamta_data
  - normalisera
  - berakna_och_analysera
  - validera_metod
  - presentera_med_provenance
ci:
  github:
    enabled: true
    workflow: .github/workflows/ci.yml
release:
  github:
    enabled: true
    workflow: .github/workflows/release.yml
    version_source: release_tag
structure:
  conversation_starters:
    path: assistant/conversation-starters
  runtime_policy:
    path: assistant/policies
  schemas:
    path: schemas
  templates:
    path: templates
tools:
  contract_version: 1
  schema: schemas/tool-contract.schema.json
  tools:
  - id: source-planner
    type: script
    requirement: recommended
    purpose: Välj källor och skapa konservativ frågeplan (v1 guardrail).
    script: scripts/source_planner.py
    deterministic: true
    mutates_workspace: false
    working_directory: workspace
    runtime_fallback: degrade
  - id: adaptive-source-planner
    type: script
    requirement: recommended
    purpose: Validera semantisk frågeplan mot source registry och välj direct eller review_before_execution.
    script: scripts/adaptive_source_planner.py
    deterministic: true
    mutates_workspace: false
    working_directory: workspace
    runtime_fallback: degrade
  - id: external-source-validator
    type: script
    requirement: recommended
    purpose: Verifiera externa tier B/C-källor och skapa obligatorisk disclosure innan de används.
    script: scripts/external_source_validator.py
    deterministic: true
    mutates_workspace: false
    working_directory: workspace
    runtime_fallback: degrade
  - id: scb-adapter
    type: script
    requirement: recommended
    purpose: Bygg verifierade SCB/PxWeb-uttag från metadata.
