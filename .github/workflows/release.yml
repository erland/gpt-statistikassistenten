name: Build release distributions

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest
      - name: Obtain pinned GPT Byggaren 1.6.33 engine
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/erland/gpt-byggaren/releases/download/v1.6.33/gpt-byggaren-engine-1.6.33.zip \
            -o /tmp/gpt-byggaren-engine.zip
          echo '9638ce2b9300423ace6c055ef824284154788d9d8e6e54459f875fe56ff69885  /tmp/gpt-byggaren-engine.zip' | sha256sum -c -
          mkdir -p /tmp/gpt-byggaren-engine
          unzip -q /tmp/gpt-byggaren-engine.zip -d /tmp/gpt-byggaren-engine
      - name: Verify canonical engine installation
        run: |
          python /tmp/gpt-byggaren-engine/scripts/install_distribution_engine.py --source /tmp/gpt-byggaren-engine --project-root .
      - name: Derive version from release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $TAG"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Lint project with canonical engine
        run: python /tmp/gpt-byggaren-engine/scripts/lint_gpt_project.py --project-root .
      - name: Validate model robustness
        run: python /tmp/gpt-byggaren-engine/scripts/validate_model_robustness.py --project-root .
      - name: Test statistics logic
        run: python -m pytest -q -p no:cacheprovider
      - name: Test standalone statistics Engine
        run: python scripts/engine_selftest.py
      - name: Final project hygiene
        run: python /tmp/gpt-byggaren-engine/scripts/project_hygiene.py --project-root . --mode final
      - name: Build the canonical project and five runtimes
        run: python /tmp/gpt-byggaren-engine/scripts/build_distributions.py --project-root . --version "${VERSION}" --targets project,chat,plugin,claude_project,claude_skills,opencode
      - name: Validate all distributions
        run: python /tmp/gpt-byggaren-engine/scripts/validate_distributions.py --project-root .
      - name: Verify the six archive artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          for target in project chat plugin claude-project claude-skills opencode engine; do
            test -s "dist/statistikassistenten-${target}-${VERSION}.zip"
          done
          (cd dist && sha256sum -c SHA256SUMS.txt)
          python - <<'PYCHK'
          import zipfile, os
          version = os.environ['VERSION']
          skills = ('statistikkallor', 'statistikkvalitet', 'statistikpresentation')
          with zipfile.ZipFile(f'dist/statistikassistenten-plugin-{version}.zip') as z:
              names = set(z.namelist())
              assert 'plugin.json' in names
              for skill in skills:
                  assert f'skills/{skill}/SKILL.md' in names, skill
              for resource in ('references/source-registry.yaml',
                               'scripts/calculation_engine.py',
                               'scripts/quality_gate.py'):
                  assert any(f'skills/{skill}/{resource}' in names for skill in skills), resource
          PYCHK
      - name: Verify Plugin and Engine handoff contract
        run: |
          python scripts/verify_plugin_engine_handoff.py \
            --plugin "dist/statistikassistenten-plugin-${VERSION}.zip" \
            --engine "dist/statistikassistenten-engine-${VERSION}.zip"
      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" dist/*.zip dist/SHA256SUMS.txt dist/DELIVERY-MANIFEST.json --clobber
