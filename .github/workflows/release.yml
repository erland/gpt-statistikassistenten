name: Build release distributions

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest
      - name: Derive version from release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $TAG"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Lint project
        run: python tools/gpt_builder/lint_gpt_project.py --project-root .
      - name: Validate model robustness
        run: python tools/gpt_builder/validate_model_robustness.py --project-root .
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
      - name: Final project hygiene
        run: python tools/gpt_builder/project_hygiene.py --project-root . --mode final
      - name: Build release distributions
        run: python tools/gpt_builder/build_distributions.py --project-root . --version "${{ steps.version.outputs.version }}" --targets project,chat,custom-gpt,opencode
      - name: Validate distributions
        run: python tools/gpt_builder/validate_distributions.py --project-root .
      - name: Verify Custom GPT Actions are packaged
        shell: bash
        run: |
          set -euo pipefail
          ZIP="dist/statistikassistenten-custom-gpt-${{ steps.version.outputs.version }}.zip"
          unzip -l "$ZIP" | grep 'builder/actions/scb-openapi.yaml'
          unzip -l "$ZIP" | grep 'builder/actions/eurostat-openapi.yaml'
          unzip -l "$ZIP" | grep 'builder/actions/comext-openapi.yaml'
          unzip -l "$ZIP" | grep 'builder/actions/kolada-openapi.yaml'
          unzip -l "$ZIP" | grep 'builder/actions/socialstyrelsen-openapi.yaml'
          unzip -l "$ZIP" | grep 'builder/actions/arbetsformedlingen-openapi.yaml'
          unzip -l "$ZIP" | grep 'builder/actions/riksbank-openapi.yaml'
          unzip -l "$ZIP" | grep 'builder/actions/forsakringskassan-openapi.yaml'
          unzip -l "$ZIP" | grep 'builder/actions/smhi-openapi.yaml'
          unzip -l "$ZIP" | grep 'builder/actions/worldbank-openapi.yaml'
          unzip -l "$ZIP" | grep 'builder/actions/oecd-openapi.yaml'
          unzip -l "$ZIP" | grep 'builder/actions/bis-openapi.yaml'
          unzip -l "$ZIP" | grep 'builder/actions/ecb-openapi.yaml'
      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" dist/*.zip dist/SHA256SUMS.txt dist/DELIVERY-MANIFEST.json --clobber
