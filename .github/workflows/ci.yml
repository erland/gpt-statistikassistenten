name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml jsonschema pytest
      - name: Lint project
        run: python tools/gpt_builder/lint_gpt_project.py --project-root .
      - name: Validate model robustness
        run: python tools/gpt_builder/validate_model_robustness.py --project-root .
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
      - name: Final project hygiene
        run: python tools/gpt_builder/project_hygiene.py --project-root . --mode final
      - name: Build all distributions
        run: python tools/gpt_builder/build_distributions.py --project-root . --version 0.0.0-ci --targets project,chat,custom-gpt,opencode,plugin
      - name: Validate distributions
        run: python tools/gpt_builder/validate_distributions.py --project-root .
      - name: Verify OpenAI Plugin resources are packaged
        shell: bash
        run: |
          set -euo pipefail
          ZIP="dist/statistikassistenten-plugin-0.0.0-ci.zip"
          unzip -l "$ZIP" | grep 'plugin.json'
          unzip -l "$ZIP" | grep 'skills/statistikassistenten/SKILL.md'
          unzip -l "$ZIP" | grep 'skills/statistikassistenten/references/source-registry.yaml'
          unzip -l "$ZIP" | grep 'skills/statistikassistenten/scripts/adaptive_source_planner.py'
          unzip -l "$ZIP" | grep 'skills/statistikassistenten/scripts/calculation_engine.py'
          unzip -l "$ZIP" | grep 'skills/statistikassistenten/scripts/quality_gate.py'
          python - <<'PY'
          import json, zipfile
          path = "dist/statistikassistenten-plugin-0.0.0-ci.zip"
          with zipfile.ZipFile(path) as zf:
              contract = json.loads(zf.read("runtime-contract.json"))
          assert contract["runtime_id"] == "openai_plugin"
          caps = contract["capabilities"]["requirements"]
          assert caps["web"]["level"] == "required"
          assert caps["structured_data"]["level"] == "required"
          assert caps["code_execution"]["level"] == "recommended"
          PY
      - name: Verify Custom GPT Actions are packaged
        shell: bash
        run: |
          set -euo pipefail
          unzip -l dist/statistikassistenten-custom-gpt-0.0.0-ci.zip | grep 'builder/actions/scb-openapi.yaml'
          unzip -l dist/statistikassistenten-custom-gpt-0.0.0-ci.zip | grep 'builder/actions/eurostat-openapi.yaml'
          unzip -l dist/statistikassistenten-custom-gpt-0.0.0-ci.zip | grep 'builder/actions/comext-openapi.yaml'
          unzip -l dist/statistikassistenten-custom-gpt-0.0.0-ci.zip | grep 'builder/actions/kolada-openapi.yaml'
          unzip -l dist/statistikassistenten-custom-gpt-0.0.0-ci.zip | grep 'builder/actions/socialstyrelsen-openapi.yaml'
          unzip -l dist/statistikassistenten-custom-gpt-0.0.0-ci.zip | grep 'builder/actions/arbetsformedlingen-openapi.yaml'
          unzip -l dist/statistikassistenten-custom-gpt-0.0.0-ci.zip | grep 'builder/actions/riksbank-openapi.yaml'
          unzip -l dist/statistikassistenten-custom-gpt-0.0.0-ci.zip | grep 'builder/actions/forsakringskassan-openapi.yaml'
          unzip -l dist/statistikassistenten-custom-gpt-0.0.0-ci.zip | grep 'builder/actions/smhi-openapi.yaml'
          unzip -l dist/statistikassistenten-custom-gpt-0.0.0-ci.zip | grep 'builder/actions/worldbank-openapi.yaml'
          unzip -l dist/statistikassistenten-custom-gpt-0.0.0-ci.zip | grep 'builder/actions/oecd-openapi.yaml'
          unzip -l dist/statistikassistenten-custom-gpt-0.0.0-ci.zip | grep 'builder/actions/bis-openapi.yaml'
          unzip -l dist/statistikassistenten-custom-gpt-0.0.0-ci.zip | grep 'builder/actions/ecb-openapi.yaml'
          unzip -l dist/statistikassistenten-custom-gpt-0.0.0-ci.zip | grep 'builder/actions/euda-openapi.yaml'
