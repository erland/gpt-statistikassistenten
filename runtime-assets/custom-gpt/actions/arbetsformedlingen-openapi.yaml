openapi: 3.1.0
info: {title: Arbetsförmedlingen JobSearch, version: 1.0.0, description: Publik sökning i platsannonser.}
servers: [{url: https://jobsearch.api.jobtechdev.se}]
paths:
  /search:
    get:
      operationId: searchJobAds
      summary: Sök platsannonser
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: offset, in: query, required: false, schema: {type: integer, minimum: 0, default: 0}}
        - {name: municipality, in: query, required: false, schema: {type: string}}
        - {name: occupation-field, in: query, required: false, schema: {type: string}}
      responses: {'200': {description: Platsannonser}}
