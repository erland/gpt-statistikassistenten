registry_version: 1
purpose: >
  Capability registry for source planning. catalog_scope describes what the
  official source actually publishes; integrated_scope describes what the
  current Statistikassistenten integration can retrieve or plan safely.
source_tiers:
  A: integrated_and_quality_assured
  B: official_primary_not_integrated
  C: credible_secondary_not_integrated
  D: unverified_or_unsuitable
planning_principles:
  - Decompose the question into measures before selecting sources.
  - Prefer the original producer for a measure when comparable access exists.
  - Do not infer integrated capability from catalog_scope.
  - Aggregators must preserve original producer metadata when available.
  - Use supporting sources only for a distinct measure, denominator, join dimension, or context.
  - Multi-source combinations require METHOD-GATE.
  - If no tier-A source covers a required measure, discover tier-B sources before tier-C.
  - External sources must be labelled as not quality-assured by Statistikassistenten.

sources:
  scb:
    name: Statistikmyndigheten SCB / Statistikdatabasen
    producer_role: mixed_producer_and_aggregator
    tier: A
    catalog_scope:
