      - Units include kilograms, litres and pieces and must not be combined blindly.
    evidence:
      - https://www.tullverket.se/sv/omoss/beslagsstatistik.4.226de36015804b8cf353949.html

  statskontoret:
    name: Statskontoret
    producer_role: primary_statistical_authority_for_state_budget_outturn_and_government_metadata
    tier: A
    catalog_scope:
      - monthly_state_budget_outturn
      - annual_state_budget_outturn
      - state_budget_time_series
      - real_economic_distribution_of_appropriations
      - agency_directory
      - annual_work_units
      - agency_governance_form
    integrated_scope:
      - monthly_budget_outturn
      - annual_budget_outturn
      - agency_directory
    geographies: [sweden, government_agency, appropriation_and_budget_structure]
    frequencies: [monthly, annual]
    primary_for:
      - Swedish_state_budget_outturn
      - appropriations_and_budget_outturn_by_agency
      - government_agency_directory_and_annual_work_units
    secondary_for:
      - state_finance_context
    limitations:
      - Appropriation outturn is not the same as an agency's accrual-based total cost.
      - Real-economic distribution exists but is not currently integrated.
    evidence:
      - https://www.statskontoret.se/analys-och-statistik/oppna-data/
      - https://www.statskontoret.se/analys-och-statistik/officiell-statistik/tidsserier-statens-budget-m.m

  svk:
    name: Svenska kraftnät Mimer
    producer_role: primary_power_system_operational_data_provider
    tier: A
    catalog_scope:
