external_fallback:
  trigger:
    - no_tier_A_source_covers_required_measure
    - tier_A_source_exists_but_integrated_scope_cannot_retrieve_required_measure
  search_order:
    - tier_B_official_primary_source_or_official_open_data
    - tier_B_official_international_organisation
    - tier_C_credible_research_or_secondary_source
  requirements:
    - identify_producer_and_dataset_before_extracting_values
    - verify_definition_population_geography_period_unit_and_status
    - prefer_machine_readable_official_API_or_download
    - avoid_undocumented_internal_endpoints_and_arbitrary_scraping
    - run_METADATA_GATE_METHOD_GATE_PROVENANCE_GATE
    - label_source_as_external_not_quality_assured_by_Statistikassistenten
  response_disclosure: >
    State that no integrated quality-assured source covered the required measure,
    name the external source used, and distinguish source verification performed
    for this answer from inclusion in the permanent source registry.
