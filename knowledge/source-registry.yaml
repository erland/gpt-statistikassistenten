    frequencies: [annual, quarterly, monthly, other_dataset_specific]
    primary_for:
      - harmonised_EU_comparisons
      - EU_policy_indicators
      - eurostat_specific_harmonised_series
    secondary_for:
      - international_context_for_Swedish_statistics
    limitations:
      - Prefer specialised Comext for detailed goods trade.
      - Dataset definitions and harmonisation may differ from national series.
    evidence:
      - https://ec.europa.eu/eurostat/data/statistical-themes
      - https://ec.europa.eu/eurostat/data/database

