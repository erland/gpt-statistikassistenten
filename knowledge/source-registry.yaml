    name: Eurostat Comext
    producer_role: specialised_trade_database
    tier: A
    catalog_scope:
      - detailed_international_trade_in_goods
      - imports_and_exports
      - value_and_quantity
      - product_classifications
      - partner_countries
      - trade_by_enterprise_characteristics
      - prodcom_related_datasets
