    geographies: [sweden, SE1, SE2, SE3, SE4, network_area]
    frequencies: [operational_time_series_endpoint_specific]
    primary_for:
      - detailed_Swedish_physical_electricity_production_and_consumption
    secondary_for:
      - operational_electricity_context
    limitations:
      - Not customer electricity prices.
      - Not Nord Pool spot/day-ahead prices.
