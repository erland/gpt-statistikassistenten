      - population_and_living_conditions
      - balance_of_payments_and_international_investment
      - housing_buildings_and_land
      - democracy
      - energy
      - financial_markets
      - public_health
      - research_innovation_and_digital_society
      - household_finances
      - health_and_medical_care
      - agriculture_forestry_and_fisheries
      - culture_and_leisure
      - environment
      - national_accounts
      - business_and_external_trade
      - public_finance
      - prices_and_consumption
      - social_services
      - transport_and_communications
      - education_and_research
    integrated_scope:
      - generic_pxweb_v2_table_search_and_metadata
      - Swedish_population_and_society
      - domestic_trade_retail_ecommerce_and_consumption
      - central_government_employment_and_wages
      - customer_electricity_prices_and_contracts
    geographies: [sweden, national, region, county, municipality, other_table_specific]
    frequencies: [annual, quarterly, monthly, other_table_specific]
    primary_for:
      - Swedish_population
      - Swedish_labour_market_general
      - Swedish_national_accounts
      - Swedish_prices_general
      - Swedish_customer_electricity_prices
      - Swedish_central_government_employment_and_wages
      - Swedish_domestic_trade_and_consumption
    secondary_for:
      - denominators_for_Swedish_per_capita_measures
      - cross_domain_context
    limitations:
      - Statisticsdatabasen also republishes statistics from other responsible authorities; preserve original producer.
      - Table-specific definitions, revisions, disclosure control and frequency must be verified in metadata.
    evidence:
      - https://www.scb.se/hitta-statistik/
      - https://www.statistikdatabasen.scb.se/pxweb/sv/ssd/

  eurostat:
    name: Eurostat
    producer_role: harmonising_aggregator_and_statistical_authority
    tier: A
    catalog_scope:
      - general_and_regional_statistics
      - economy_and_finance
      - population_and_social_conditions
      - industry_trade_and_services
      - agriculture_fisheries_and_forestry
      - international_trade
      - transport
      - environment_and_energy
      - science_technology_and_digital_society
